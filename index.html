    .catch(function(x1){stg('옛 등록 지우고 다시 받는 중');
      return tmo(reg.pushManager.getSubscription().then(function(s){return s?s.unsubscribe():0;}),5000,'옛 등록 지우기').catch(function(){})
      .then(function(){return tmo(tok(),20000,'알림 주소 다시 받기');})
      .catch(function(x2){throw new Error(String(x1&&x1.message||x1)+' → '+String(x2&&x2.message||x2));});});})
  .then(function(t){if(!t)throw new Error('알림 주소가 비어 있어요');return t;});}
/* 「허용」 창: 옛 방식(콜백)도 받고, 창이 안 뜨면 40초 뒤 알려 줌 */
function askPerm(){return new Promise(function(ok){var fin=0,iv;function f(p){if(fin)return;fin=1;clearInterval(iv);ok(p||Notification.permission);}
  try{var r=Notification.requestPermission(f);if(r&&r.then)r.then(f,function(){f(Notification.permission);});}catch(x){f(Notification.permission);}
  iv=setInterval(function(){if(Notification.permission!=='default')f(Notification.permission);},500);
  setTimeout(function(){f(Notification.permission);},40000);});}
/* v26: 안드로이드인데 크롬이 아닌 브라우저(삼성 인터넷 · 웨일 · 카톡 등)로 연 앱 → 「허용」 창이 안 뜨는 경우가 많음 → 시도하지 않고 크롬 재설치 안내 팝업 하나만 */
function nonChrome(){var u=navigator.userAgent;if(!/Android/.test(u))return '';
  if(/SamsungBrowser/.test(u))return '삼성 인터넷';if(/Whale/.test(u))return '네이버 웨일';if(/NAVER/.test(u))return '네이버 앱';if(/KAKAOTALK/i.test(u))return '카카오톡';
  if(/EdgA/.test(u))return '엣지';if(/OPR|Opera/.test(u))return '오페라';if(/Firefox/.test(u))return '파이어폭스';if(/; wv\)/.test(u)||!/Chrome\//.test(u))return '이 브라우저';return '';}
function chromeAsk(br){var o=document.getElementById('pask');if(o)o.remove();o=document.createElement('div');o.id='pask';
  var go='intent://rescuelife.github.io/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome')+';end';
  var st='display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;line-height:1.45;color:#14171F;margin:0 0 9px',nb='flex:none;width:22px;height:22px;border-radius:50%;background:#D7263D;color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:1px';
  o.innerHTML='<div class="pk" role="dialog" aria-modal="true" aria-label="크롬으로 다시 설치"><div style="font-size:40px;line-height:1;margin-bottom:6px">🔔</div><b>알림은 크롬 앱에서만 켤 수 있어요</b>'+
   '<p style="margin:8px 0 14px">지금 앱은 <b>'+br+'</b>(으)로 설치돼 있어서<br>휴대폰 알림을 켤 수 없어요.</p>'+
   '<div style="background:#F6F5F1;border-radius:14px;padding:12px 12px 3px;margin:0 0 14px">'+
   '<div style="'+st+'"><span style="'+nb+'">1</span><span>아래 <b>「크롬으로 열기」</b></span></div>'+
   '<div style="'+st+'"><span style="'+nb+'">2</span><span>크롬 오른쪽 위 <b>⋮ → 앱 설치</b></span></div>'+
   '<div style="'+st+'"><span style="'+nb+'">3</span><span>새 아이콘으로 열고 <b>⚙ 설정 → 알림 켜기 → 허용</b></span></div></div>'+
   '<div style="font-size:12.5px;color:#8A8F99;margin:-4px 0 14px;line-height:1.5">비밀번호 · 내 이름은 한 번 다시 입력해요.<br>설치가 끝나면 예전 아이콘은 지워 주세요.</div>'+
   '<div class="pb"><button type="button" id="pkn">나중에</button><button type="button" id="pky">크롬으로 열기</button></div></div>';
  document.body.appendChild(o);o.querySelector('#pkn').onclick=function(){o.remove();};
  o.querySelector('#pky').onclick=function(){var a=document.createElement('a');a.href=go;document.body.appendChild(a);a.click();a.remove();};}
/* 고장 찾기용 한 줄: 기기 · 브라우저 · 홈 화면 앱 여부 · 허용 상태 · 뒷일꾼 상태 */
function pdiag(){var u=navigator.userAgent,os=(u.match(/Android [\d.]+/)||u.match(/iPhone OS [\d_]+/)||['PC'])[0].replace(/_/g,'.'),
  br=/SamsungBrowser\/[\d]+/.test(u)?'삼성인터넷 '+u.match(/SamsungBrowser\/([\d]+)/)[1]:/KAKAOTALK/i.test(u)?'카톡 안 브라우저':/NAVER/.test(u)?'네이버 앱':(u.match(/Chrome\/(\d+)/)?'크롬 '+u.match(/Chrome\/(\d+)/)[1]:u.match(/Version\/([\d.]+).*Safari/)?'사파리 '+u.match(/Version\/([\d.]+)/)[1]:'기타'),
  app=navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);var sw=navigator.serviceWorker&&navigator.serviceWorker.controller?'켜짐':'꺼짐';
  return os+' · '+br+' · '+(app?'홈 화면 앱':'브라우저 탭')+' · 허용 '+(window.Notification?Notification.permission:'없음')+' · 뒷일꾼 '+sw+' · v26';}
/* 진행 창: 단계 · 몇 초째 · 언제든 취소 · 실패하면 이유를 남겨 둠 */
function pushUI(rep,ask){var o=document.getElementById('pask');if(o)o.remove();o=document.createElement('div');o.id='pask';
  o.innerHTML='<div class="pk" role="dialog" aria-modal="true" aria-label="휴대폰 알림 켜기"><b>🔔 휴대폰 알림 켜기</b><p id="pkm"></p><div id="pkd" style="display:none;font-size:11.5px;line-height:1.5;color:#8A8F99;background:#F6F5F1;border-radius:10px;padding:8px 10px;margin:-6px 0 14px;word-break:keep-all;text-align:left"></div><div class="pb"><button type="button" id="pkn">나중에</button><button type="button" id="pky">켜기</button></div></div>';
  document.body.appendChild(o);fbLoad().catch(function(){});
  var M=o.querySelector('#pkm'),D=o.querySelector('#pkd'),N=o.querySelector('#pkn'),Y=o.querySelector('#pky'),fin=0,t0=0,tick=0,cur='',hard=0;
  function txt(h){M.innerHTML=h;}
  function paint(){if(fin)return;var s=Math.round((Date.now()-t0)/1000);txt(cur+'<br><span style="font-size:13px;color:#8A8F99">'+s+'초째'+(s>=20?' · 조금만 더 기다려 주세요':'')+'</span>');}
  function stg(t){cur=t+'…';if(!tick){t0=Date.now();tick=setInterval(paint,1000);}paint();}
  function stop(){clearInterval(tick);clearTimeout(hard);}
  function ok(t){if(fin)return;fin=1;stop();o.remove();rep({rl:'pushtok',t:t});}
  function bad(x){if(fin)return;fin=1;stop();var m=String(x&&x.message||x).slice(0,160),st=x&&x.st||'fail';rep({rl:'pushtok',err:st,m:m});
    if(st==='cancel'){o.remove();return;}
    txt('<b style="color:#C93A2E">알림을 켜지 못했어요</b><br>'+m.replace(/</g,'&lt;')+'<br><span style="font-size:13px">잠시 뒤 다시 눌러 보고, 그래도 안 되면 <b>이 화면을 캡처</b>해서 관리자에게 보내 주세요.</span>');
    D.textContent=pdiag();D.style.display='block';N.style.display='none';Y.disabled=false;Y.textContent='닫기';Y.onclick=function(){o.remove();};}
  function run(){N.textContent='취소';Y.style.display='none';
    stg('알림 주소 받는 중');pushTok(stg).then(ok,bad);}
  /* 안쪽 화면은 120초까지만 기다림 → 창을 연 때부터 110초 안에 반드시 끝냄 */
  hard=setTimeout(function(){bad(new Error(cur?cur.replace('…','')+' 단계에서 너무 오래 걸렸어요':'시간이 지났어요. 설정에서 「켜기」를 다시 눌러 주세요'));},110000);
  N.onclick=function(){var e=new Error('cancel');e.st='cancel';bad(e);};
  if(!ask){run();return;}
  txt('근무 · 이송 요청 같은 소식을<br>앱을 안 열어도 알려 드려요.<br>다음 창에서 <b>「허용」</b>을 눌러 주세요.');
  Y.onclick=function(){Y.disabled=true;Y.textContent='켜는 중…';N.textContent='취소';stg('「허용」 창을 기다리는 중');
    var hint=setTimeout(function(){if(!fin&&Notification.permission==='default'){cur='「허용」 창이 안 보이면 화면 위·아래의 🔔 표시를 눌러 주세요…';paint();}},8000);
    askPerm().then(function(p){clearTimeout(hint);if(fin)return;if(p!=='granted'){var e=new Error(p==='default'?'「허용」 창이 뜨지 않았어요. 휴대폰 설정 → 애플리케이션 → 레스큐라이프(또는 크롬) → 알림을 켠 뒤 다시 눌러 주세요':'알림이 막혀 있어요. 휴대폰 설정 → 애플리케이션 → 레스큐라이프(또는 크롬) → 알림 → 허용');e.st=p==='denied'?'denied':'fail';bad(e);return;}
      run();});};}
/* 알림을 누르면 그 화면으로 */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data;if(!d||d.rl!=='nav'||!VIEWS.hasOwnProperty(d.v))return;history.pushState(null,'',d.v?'#'+d.v:location.pathname);show(d.v,true);});
</script>
