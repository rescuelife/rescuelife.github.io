<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레스큐라이프</title>
<meta name="description" content="레스큐라이프 행사대기 근무 일정">
<meta name="theme-color" content="#15171C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레스큐라이프">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html,body{margin:0;height:100%;background:#F3F1EC;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #frames{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top)}
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#F3F1EC;visibility:hidden;pointer-events:none}
  #frames iframe.on{visibility:visible;pointer-events:auto;z-index:1}
  #bar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#15171C}
  #splash{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 45%,#fff 55%,#F3F5F8 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;transition:opacity .45s ease;z-index:5;overflow:hidden;cursor:default}
  #splash.off{opacity:0;pointer-events:none}
  #splash.off .lg{transform:scale(1.05)}
  /* 🚑 시작 로고: 빨간 심전도가 달려와 → 그 선에서 R이 위(빨강)·아래(파랑)로 차오름 → 박동 한 번 → 빨간 선 위로 흰 선이 지나가며 로고의 흰 심전도가 됨 → RESCUE / LIFE 가 한 줄씩 올라옴 → 빛이 한 번 스침 */
  .lg{position:relative;width:min(78vw,340px);aspect-ratio:935/240;transition:transform .45s ease}
  .lg img{position:absolute;display:block;-webkit-user-drag:none;user-select:none}
  .lg .rr{position:absolute;left:0;top:0;width:27.3%;height:100%;transform-origin:46% 50%;animation:pop .55s cubic-bezier(.16,1,.3,1) .72s backwards,beat .5s cubic-bezier(.3,0,.3,1) 1.16s,idle 1.4s ease-in-out 2.7s infinite}
  .lg .rr img{left:0;top:0;width:366.3%;height:100%}
  .lg .rt{clip-path:inset(0 72.7% 40% 0);animation:rt .55s cubic-bezier(.16,1,.3,1) .72s both}
  .lg .rb{clip-path:inset(59.5% 72.7% 0 0);animation:rb .55s cubic-bezier(.16,1,.3,1) .72s both}
  .lg .sh{position:absolute;inset:0;-webkit-mask:url(logo-full.png) 0 0/366.3% 100% no-repeat;mask:url(logo-full.png) 0 0/366.3% 100% no-repeat;background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 62%) 100% 0/300% 100% no-repeat;animation:sh .75s cubic-bezier(.4,0,.2,1) 1.8s both}
  .lg svg.ecg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2;transform-origin:12.56% 50%;animation:beat .5s cubic-bezier(.3,0,.3,1) 1.16s}
  .ecg path{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0 300;stroke-dashoffset:0}
  .ecg .a{stroke:#E30011;filter:drop-shadow(0 0 4px rgba(255,40,60,.45));animation:ra 2s linear .02s both}
  .ecg circle{display:none;fill:#FF2A3A;filter:drop-shadow(0 0 7px #ff3b4a)}
  @supports (offset-path:path("M-700 143 H24 L48 108 L60 169 L88 57 L107 224 L129 117 L140 137 L152 118 H1100")){.ecg circle{display:block;offset-path:path("M-700 143 H24 L48 108 L60 169 L88 57 L107 224 L129 117 L140 137 L152 118 H1100");offset-rotate:0deg;animation:hd 2s linear .02s both}}
  .lg .ring{position:absolute;left:12.56%;top:50%;width:30%;aspect-ratio:1;border:1.5px solid rgba(227,0,17,.55);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.7);animation:ring .9s cubic-bezier(.16,1,.3,1) 1.18s forwards}
  .lg .gl{position:absolute;left:12.56%;top:50%;width:62%;aspect-ratio:1;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
  .lg .gl.r{background:radial-gradient(closest-side,rgba(255,45,60,.22),rgba(255,45,60,0));animation:gl .7s ease-in-out 1.14s}
  .lg .gl.b{background:radial-gradient(closest-side,rgba(40,105,255,.2),rgba(40,105,255,0));animation:gl .8s ease-in-out 1.5s}
  .lg .ln{position:absolute;left:27.3%;width:72.7%;overflow:hidden;animation:wp .46s cubic-bezier(.5,0,.6,.9) 1.2s both}
  .lg .l1{top:8.33%;height:40%}.lg .l2{top:50%;height:40.83%}
  .lg .ln img{left:-37.55%;width:137.55%;animation:up .6s cubic-bezier(.16,1,.3,1) 1.22s both}
  .lg .l1 img{top:-20.83%;height:250%;clip-path:inset(8.33% 0 51.67% 0)}
  .lg .l2 img{top:-122.45%;height:244.9%;clip-path:inset(50% 0 9.17% 0);animation-name:dn}
  .ld{display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;animation:fi .5s ease 2.5s both}
  .ld svg{width:96px;height:20px;overflow:visible}
  .ld path{fill:none;stroke:#E30011;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50 200;animation:mon 1.4s linear infinite}
  .ld span{font-size:12.5px;color:#8A8F99;letter-spacing:.08em}
  @keyframes ra{0%{stroke-dasharray:0 300;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.5,0,.9,.6)}15%{stroke-dasharray:32.69 300;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.2,.4,.3,1)}42.5%,56%{stroke-dasharray:56.18 300;stroke-dashoffset:0;animation-timing-function:cubic-bezier(.5,0,.6,.9)}70%{stroke-dasharray:46 300;stroke-dashoffset:-34;animation-timing-function:linear}84%{stroke-dasharray:28 300;stroke-dashoffset:-72;animation-timing-function:cubic-bezier(.3,.3,.4,1)}100%{stroke-dasharray:0 300;stroke-dashoffset:-100}}
  @keyframes hd{0%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.5,0,.9,.6)}15%{offset-distance:32.69%;animation-timing-function:cubic-bezier(.2,.4,.3,1)}42.5%,56%{offset-distance:56.18%;opacity:1;animation-timing-function:cubic-bezier(.5,0,.6,.9)}70%{offset-distance:80%;animation-timing-function:linear}84%{offset-distance:100%;opacity:1}86%,100%{offset-distance:100%;opacity:0}}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes rt{from{clip-path:inset(60% 72.7% 40% 0)}to{clip-path:inset(0 72.7% 40% 0)}}
  @keyframes rb{from{clip-path:inset(59.5% 72.7% 40% 0)}to{clip-path:inset(59.5% 72.7% 0 0)}}
  @keyframes pop{from{transform:scale(.94)}to{transform:scale(1)}}
  @keyframes beat{0%,100%{transform:scale(1)}35%{transform:scale(1.065)}}
  @keyframes idle{0%,48%,100%{transform:scale(1)}12%{transform:scale(1.035)}24%{transform:scale(1)}36%{transform:scale(1.018)}}
  @keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
  @keyframes gl{0%,100%{opacity:0}40%{opacity:1}}
  @keyframes sh{from{background-position:100% 0}to{background-position:0% 0}}
  @keyframes up{from{transform:translateY(9%)}to{transform:none}}
  @keyframes dn{from{transform:translateY(-9%)}to{transform:none}}
  @keyframes wp{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes fo{to{opacity:0}}
  @keyframes fi{to{opacity:1}}
  @keyframes mon{from{stroke-dashoffset:250}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}.lg svg.ecg,.lg .ring,.lg .gl,.lg .sh{display:none}.ld{opacity:1}}
  #net{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#15171C;color:#fff;border-radius:999px;padding:10px 18px;font:600 14px -apple-system,"Apple SD Gothic Neo",sans-serif;display:none;z-index:6}
</style>
</head>
<body>
<div id="bar"></div>
<div id="frames"></div>
<div id="splash" role="img" aria-label="RESCUE LIFE 불러오는 중"><div class="lg">
  <i class="gl r"></i><i class="gl b"></i><i class="ring"></i>
  <div class="rr"><img class="rt" src="logo-full.png" alt=""><img class="rb" src="logo-full.png" alt=""><i class="sh"></i></div>
  <svg class="ecg" viewBox="0 0 935 240" aria-hidden="true"><path class="a" pathLength="100" d="M-700 143 H24 L48 108 L60 169 L88 57 L107 224 L129 117 L140 137 L152 118 H1100"/><circle r="7"/></svg>
  <div class="ln l1"><img src="logo-full.png" alt=""></div><div class="ln l2"><img src="logo-full.png" alt=""></div>
</div><div class="ld"><svg viewBox="0 0 120 24" aria-hidden="true"><path d="M0 14 H38 L44 9 L50 14 L56 2 L63 22 L68 11 L73 14 H120"/></svg><span>불러오는 중</span></div></div>
<div id="net">인터넷 연결을 확인해 주세요</div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbxCM8O-ochC4oDsjYsJiq6Iz5DoSbv7RZr3YgnMvynsNaUdoKDexgvq93R-Mq6jPwWz/exec';
var VIEWS={'':'', cal:'?view=cal', stats:'?view=stats', notice:'?view=notice', contact:'?view=contact', trans:'?view=trans', equip:'?view=equip'};
/* 속도: 한 번 연 화면은 숨겨 두었다가 다시 보여 줌(탭 전환이 바로 됨).
   잠시(FRESH) 안 본 화면은 보여 줄 때 데이터만 새로 받게 알림. 자주 쓰는 탭은 미리 열어 둠. */
var FRESH=20000, PRELOAD=['','cal','contact'];
var box=document.getElementById('frames'), sp=document.getElementById('splash');
/* 로고 애니메이션(약 2초)은 끝까지 보여 주고 닫음. 화면이 다 떴으면 탭해서 바로 넘기기 */
var T0=Date.now(), MIN=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?0:2400, spT=0;
function spOff(now){clearTimeout(spT);var w=now?0:Math.max(0,T0+MIN-Date.now());spT=setTimeout(function(){sp.classList.add('off');},w);}
function spOn(){clearTimeout(spT);sp.classList.remove('off');}
sp.addEventListener('click',function(){if(CUR!==null&&F[CUR]&&F[CUR].ready)spOff(true);});
var F={}, CUR=null;
function viewOf(){var h=(location.hash||'').replace('#','');return VIEWS.hasOwnProperty(h)?h:'';}
function make(v){
  var f=document.createElement('iframe');f.title='레스큐라이프';f.setAttribute('allow','clipboard-write');
  var o={el:f,ready:false,seen:0};F[v]=o;
  f.addEventListener('load',function(){o.ready=true;if(CUR===v)setTimeout(spOff,250);});
  f.src=EXEC+VIEWS[v];box.appendChild(f);return o;
}
function reload(v){var o=F[v];o.ready=false;o.el.src=EXEC+VIEWS[v]+(VIEWS[v]?'&':'?')+'_='+Date.now();}
/* 화면 안쪽(앱스 스크립트가 감싼 프레임)까지 '데이터 새로 받기' 알림 */
function refresh(v){var o=F[v];if(!o||!o.ready)return;(function bc(w,d){try{w.postMessage({rl:'refresh'},'*');}catch(e){}if(d<3)try{for(var i=0;i<w.frames.length;i++)bc(w.frames[i],d+1);}catch(e){}})(o.el.contentWindow,0);}
function show(v,force){
  var o=F[v],now=Date.now();
  if(!o)o=make(v);
  else if(force)reload(v);
  else if(o.seen&&CUR!==v&&now-o.seen>FRESH)refresh(v);
  if(CUR!==null&&F[CUR])F[CUR].seen=now;
  for(var k in F)F[k].el.classList.toggle('on',k===v);
  CUR=v;o.seen=now;
  if(o.ready)spOff();else spOn();
}
setTimeout(function(){spOff(true);},12000);
window.addEventListener('message',function(e){
  var d=e.data;if(!d||d.rl!=='go'||typeof d.url!=='string'||d.url.indexOf(EXEC)!==0)return;
  var m=d.url.match(/view=(cal|stats|notice|contact|trans|equip)/), v=m?m[1]:'';
  if(v===viewOf()){refresh(v);return;} /* 지금 탭을 다시 누르면 데이터만 새로 받기 */
  history.pushState(null,'',v?'#'+v:location.pathname);show(v);
});
/* 📱 아이폰: 안쪽 화면(구글 주소)의 저장 공간은 앱을 닫으면 지워짐 → 비밀번호 · 이름 · 화면 설정을 여기(설치 페이지)에 같이 보관했다가 돌려줌 */
var GOK=/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
function stGet(){try{return JSON.parse(localStorage.getItem('rl_store')||'{}')||{};}catch(e){return {};}}
function stPut(o){try{localStorage.setItem('rl_store',JSON.stringify(o));}catch(e){}}
function frameOf(src){for(var k in F){var w=F[k].el.contentWindow;if(!w)continue;if(w===src)return k;try{for(var i=0;i<w.frames.length;i++){if(w.frames[i]===src)return k;for(var j=0;j<w.frames[i].frames.length;j++)if(w.frames[i].frames[j]===src)return k;}}catch(e){}}return null;}
window.addEventListener('message',function(e){
  var d=e.data;if(!d||typeof d.rl!=='string'||!GOK.test(e.origin))return;
  if(d.rl==='save'&&typeof d.k==='string'&&/^rl_/.test(d.k)){var o=stGet();if(d.v==null)delete o[d.k];else o[d.k]=String(d.v).slice(0,2000);stPut(o);}
  else if(d.rl==='sync'&&d.s&&typeof d.s==='object'){var o2=stGet(),n=0;for(var k in d.s)if(/^rl_/.test(k)&&typeof d.s[k]==='string'&&!(k in o2)){o2[k]=d.s[k].slice(0,2000);n++;}if(n)stPut(o2);}
  else if(d.rl==='need'){try{e.source.postMessage({rl:'store',s:stGet()},e.origin);}catch(_){}}
  else if(d.rl==='reload'){var v=frameOf(e.source);if(v!==null){F[v].ready=false;if(CUR===v)spOn();F[v].el.src=EXEC+VIEWS[v];}}
});
window.addEventListener('popstate',function(){show(viewOf());});
function net(){document.getElementById('net').style.display=navigator.onLine?'none':'block';}
window.addEventListener('online',function(){net();show(viewOf(),true);});window.addEventListener('offline',net);net();
/* 앱을 백그라운드에 두었다가 다시 열면 지금 화면 데이터를 새로 받음 */
var hidAt=0;document.addEventListener('visibilitychange',function(){if(document.hidden)hidAt=Date.now();else if(hidAt&&Date.now()-hidAt>FRESH&&CUR!==null)refresh(CUR);});
show(viewOf());
/* 첫 화면이 뜬 뒤, 자주 쓰는 탭을 하나씩 뒤에서 미리 열어 둠 */
var LAST=null;(function pre(){var o=F[CUR],l=LAST&&F[LAST];if(!o||!o.ready||(l&&!l.ready)){setTimeout(pre,700);return;}
  var next=PRELOAD.filter(function(v){return !F[v];})[0];if(next===undefined)return;
  setTimeout(function(){if(!F[next]){var n=make(next);n.seen=Date.now();LAST=next;}setTimeout(pre,700);},1200);})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
